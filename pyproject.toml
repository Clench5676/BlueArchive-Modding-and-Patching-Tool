[project]
name = "Blue-Archive-Modding-and-Patching-Tool"
version = "0.7.0-alpha.10"
description = "更新、移植、修复碧蓝档案mod的工具集 | Updating&Porting&Fixing Mods for Blue Archive"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.4.0",
    "pywebview>=6.2.1",
    "spineatlas>=1.0.13",
    "tkinterdnd2>=0.4.3",
    "toml>=0.10.2",
    "ttkbootstrap>=1.10.1",
    "typed-argument-parser>=1.12.0",
    "unitypy==1.23.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
# Only the App and its engine go into wheels, whatever else lies under src/.
include = ["bmpt*", "ba_modding_toolkit*"]

[tool.setuptools.package-data]
ba_modding_toolkit = ["locales/*.json", "assets/*.ico", "assets/*.png", "py.typed"]
bmpt = [
    "locales/*.json", "catalog/data/*.json", "refine_prompts.json",
    "assets/dev-hooks.json", "assets/release-notes/*.md", "assets/tray/*",
    "web/*", "web/css/*", "web/js/*.js", "web/js/photography/*.js", "web/fonts/*",
    "web/vendor/*/*", "web/vendor/*/build/*",
    "web/vendor/*/examples/jsm/controls/*", "web/vendor/*/examples/jsm/loaders/*",
    "web/vendor/*/examples/jsm/utils/*",
]

[tool.uv.sources]
spineatlas = { git = "https://github.com/Agent-0808/SpineAtlas.git", rev = "fix/bounds-not-first" }

[project.scripts]
bamt = "bmpt.launcher:main"

[dependency-groups]
dev = [
    # the BL-056 refine engine (refine_composite); no shipped path imports it yet, so builds leave it out
    "numpy>=2.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
# collect only tests/: the checkout's root may hold the user's own data and research folders
testpaths = ["tests"]
