[project]
name = "Blue-Archive-Modding-and-Patching-Tool"
version = "0.7.0-rc.15"
description = "更新、移植、修复碧蓝档案mod的工具集 | Updating&Porting&Fixing Mods for Blue Archive"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.4.0",
    "pywebview>=6.2.1",
    "spineatlas>=1.0.13",
    "tkinterdnd2>=0.4.3",
    "toml>=0.10.2",
    "ttkbootstrap>=1.10.1",
    "typed-argument-parser>=1.12.0",
    "unitypy==1.23.0",
    # the 3D costume switch (gameassets.model_adapt) and the refine engine
    "numpy>=2.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
# Only the App and its engine go into wheels, whatever else lies under src/.
include = ["bmpt", "bmpt.*", "ba_modding_toolkit*"]

[tool.setuptools.package-data]
ba_modding_toolkit = ["locales/*.json", "assets/*.ico", "assets/*.png", "py.typed"]
bmpt = [
    "locales/*.json", "catalog/data/*.json", "refine/prompts.json",
    "assets/dev-hooks.json", "assets/release-notes/*.md", "assets/tray/*",
    "web/*", "web/css/*", "web/js/*/*.js", "web/js/thumbnail-capture/*.js", "web/fonts/*",
    "web/vendor/*/*", "web/vendor/*/build/*",
    "web/vendor/*/examples/jsm/controls/*", "web/vendor/*/examples/jsm/loaders/*",
    "web/vendor/*/examples/jsm/utils/*",
]

[tool.uv]
# ttkbootstrap 1.x declares pillow<13, but the classic GUI stays on 1.x (2.x
# rewrote the style engine) while Pillow 13 carries the security fixes; 1.x
# uses only Image.new, ImageDraw, ImageTk and ImageColor, which 13 keeps.
override-dependencies = ["pillow>=13.0.0"]
constraint-dependencies = ["ttkbootstrap<2"]

[tool.uv.sources]
spineatlas = { git = "https://github.com/Agent-0808/SpineAtlas.git", rev = "fix/bounds-not-first" }

[project.scripts]
bamt = "bmpt.launcher:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
# collect only tests/: the checkout's root may hold the user's own data and research folders
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
# Upstream's engine keeps upstream's style; vendored and local-only folders are not App code.
extend-exclude = [
    "src/ba_modding_toolkit",
    "src/bmpt/web/vendor",
    "src/bmpt_dev",
    "prototype",
    "research",
    "ai-work",
    "docs",
]

[tool.ruff.lint]
select = ["E", "F", "W", "D", "ERA"]
ignore = [
    "E731",  # a named lambda is fine for a one-line key or callback
    "E741",  # short names such as l stay readable in numeric code
]

[tool.ruff.lint.per-file-ignores]
# The package's __init__ stays empty: importing bmpt must have no effect of its own.
"src/bmpt/__init__.py" = ["D104"]
# engine.py imports the engine's names for type checking and re-exports them.
"src/bmpt/engine.py" = ["F401"]
# The entry points register the locales before importing modules that translate at import time.
"src/bmpt/webui/__main__.py" = ["E402"]
"src/bmpt/webui/main.py" = ["E402"]
# Tests import shared fixtures by name, set up paths before imports and need no docstrings.
"tests/**" = ["D", "E402", "F401", "F811"]

[tool.ruff.lint.pydocstyle]
convention = "google"
